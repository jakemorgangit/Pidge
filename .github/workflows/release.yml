name: Release

# Push a tag like v1.2.0 to build the MSI and publish a GitHub release.
# Installed copies of Pidge check the latest release and offer to update.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Read version from tag
        id: version
        shell: pwsh
        run: |
          $v = '${{ github.ref_name }}'.TrimStart('v')
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Tag must look like v1.2.3 (got ${{ github.ref_name }})" }
          "value=$v" >> $env:GITHUB_OUTPUT

      - name: Build MSI
        shell: pwsh
        run: ./build.ps1 -Version ${{ steps.version.outputs.value }}

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.msi
          generate_release_notes: true
